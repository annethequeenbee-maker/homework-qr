<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>作業繳交系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        retro: { bg: '#f0e6d2', paper: '#fffbf0', ink: '#2c2c2c', red: '#c0392b', blue: '#2980b9', green: '#27ae60', board: '#2d3436', wood: '#8e44ad', line: '#bdc3c7', woodDark: '#5d4037', woodLight: '#f7f1e3', yellow: '#f1c40f' }
      },
      fontFamily: { serif: ['"Noto Serif TC"', '"Songti TC"', 'serif'], sans: ['"Noto Sans TC"', 'sans-serif'] },
      boxShadow: { hard: '4px 4px 0px 0px rgba(0,0,0,1)', 'hard-sm': '2px 2px 0px 0px rgba(0,0,0,1)' }
    }
  }
}
</script>
<style>
body { background-color: #f0e6d2; background-image: linear-gradient(#e5dcc5 1px, transparent 1px), linear-gradient(90deg, #e5dcc5 1px, transparent 1px); background-size: 20px 20px; color: #2c2c2c; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.btn { cursor: pointer; border: 2px solid #2c2c2c; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); transition: all 0.1s; }
.btn:active { box-shadow: none; transform: translate(2px, 2px); }
.student-card { cursor: pointer; transition: all 0.15s; border: 2px solid #2c2c2c; }
.student-card:active { transform: scale(0.95); }
.status-submitted { background: #d4edda; border-color: #27ae60; }
.status-missing { background: #f8d7da; border-color: #c0392b; }
.status-needs_correction { background: #fff3cd; border-color: #e67e22; }
.status-corrected { background: #cce5ff; border-color: #2980b9; }
.status-pending { background: #f8f9fa; border-color: #bdc3c7; }
.status-late { background: #fce4ec; border-color: #e74c3c; }
.retro-card { background: #fffbf0; border: 2px solid #2c2c2c; box-shadow: 3px 3px 0 0 rgba(0,0,0,1); }
.retro-input { border: 2px solid #2c2c2c; background: #fffbf0; }
.retro-input:focus { outline: none; box-shadow: 0 0 0 3px rgba(192,57,43,0.3); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.active { display: flex; }
.print-section { display: none; }
@media print { body { background: white; } .no-print { display: none !important; } .print-section { display: block !important; } }
.nav-tab { cursor: pointer; padding: 8px 16px; font-size: 14px; font-weight: bold; border: 2px solid #2c2c2c; background: #fffbf0; transition: all 0.1s; font-family: "Noto Serif TC", serif; white-space: nowrap; }
.nav-tab:hover { background: white; }
.nav-tab.active { background: #f1c40f; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
.nav-tab:active { box-shadow: none; transform: translate(2px, 2px); }
.wood-bar { background: #f7f1e3; border: 2px solid #5d4037; box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
.tool-btn { background: #fffbf0; border: 2px solid #5d4037; box-shadow: 2px 2px 0px 0px rgba(0,0,0,1); }
.tool-btn:active { box-shadow: none; transform: translate(2px, 2px); }
/* 復古捲軸 */
.retro-scrollbar::-webkit-scrollbar { width: 12px; height: 12px; }
.retro-scrollbar::-webkit-scrollbar-track { background: #e0d0b0; border-left: 2px solid #2c2c2c; }
.retro-scrollbar::-webkit-scrollbar-thumb { background: #2c2c2c; border: 2px solid #e0d0b0; }
</style>
</head>
<body>

<!-- 裝飾暗角 -->
<div class="fixed inset-0 pointer-events-none shadow-[inset_0_0_100px_rgba(44,44,44,0.15)] z-10"></div>

<!-- ===== 頂部導航列（參考 routines.html 風格） ===== -->
<div class="no-print wood-bar rounded-[1.5rem] px-4 py-3 mx-4 mt-4 mb-2 flex justify-between items-center z-20 sticky top-0">
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="p-1 border-2 border-[#5d4037] bg-[#fcfbf9] flex items-center justify-center rounded-lg">
        <span class="text-xl">📋</span>
      </div>
      <span class="text-2xl font-black font-serif text-retro-ink tracking-widest hidden md:inline">作業繳交系統</span>
    </div>
    <div class="flex gap-1 overflow-x-auto retro-scrollbar" id="mainTabs">
      <div class="nav-tab active" data-tab="submit" onclick="switchMainTab('submit')">📷 掃描</div>
      <div class="nav-tab" data-tab="students" onclick="switchMainTab('students')">👥 學生</div>
      <div class="nav-tab" data-tab="subjects" onclick="switchMainTab('subjects')">📚 科目</div>
      <div class="nav-tab" data-tab="assignments" onclick="switchMainTab('assignments')">📝 作業</div>
      <div class="nav-tab" data-tab="check" onclick="switchMainTab('check')">✅ 檢查</div>
      <div class="nav-tab" data-tab="display" onclick="switchMainTab('display')">📺 一覽</div>
      <div class="nav-tab" data-tab="export" onclick="switchMainTab('export')">📊 報表</div>
    </div>
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <div id="loginArea" class="flex gap-1 items-center">
      <input id="teacherNameInput" type="text" placeholder="老師姓名" class="retro-input text-sm p-1 rounded w-24 font-serif" onkeydown="if(event.key==='Enter')teacherLogin()">
      <button onclick="teacherLogin()" class="btn bg-[#c0392b] text-white px-3 py-1 text-sm rounded font-bold font-serif">登入</button>
    </div>
    <div id="teacherArea" class="hidden items-center gap-1">
      <span id="teacherNameDisplay" class="text-sm font-bold font-serif px-2"></span>
      <div id="classSelector" class="hidden">
        <select id="classSelectNav" onchange="switchClass(parseInt(this.value))" class="retro-input text-sm p-1 rounded font-serif"></select>
      </div>
      <button onclick="showCreateClass()" class="btn bg-[#27ae60] text-white px-2 py-1 text-xs rounded font-bold font-serif" title="建立新班級">＋ 新班級</button>
      <button onclick="showSwitchTeacher()" class="tool-btn px-2 py-1 text-xs rounded font-serif" title="切換老師">👤</button>
      <button onclick="teacherLogout()" class="tool-btn px-2 py-1 text-xs rounded font-serif" title="登出">×</button>
    </div>
  </div>
</div>

<main class="max-w-6xl mx-auto p-3">

<!-- ===== 掃描繳交（老師用） ===== -->
<div id="tab-submit" class="tab-content active">
  <div class="retro-card p-4 mb-3 text-center">
    <div class="text-4xl mb-2">📷</div>
    <h3 class="font-bold font-serif text-lg mb-2">掃描學生 QR Code</h3>
    <p class="text-sm text-retro-ink/60 font-serif mb-3">學生拿著 QR Code 紙卡，老師用平板掃描後即可登記繳交</p>
    <div class="flex gap-2 justify-center flex-wrap mb-3">
      <input id="scanTokenInput" placeholder="貼上 QR Code 掃描結果，或輸入學生代碼" class="retro-input flex-1 min-w-[250px] p-2 rounded-lg font-serif text-sm" onkeydown="if(event.key==='Enter')teacherScanStudent()">
      <button onclick="teacherScanStudent()" class="btn bg-[#2980b9] text-white px-4 py-2 text-sm rounded font-bold font-serif">🔍 查詢</button>
    </div>
    <div class="text-xs text-retro-ink/50 font-serif">
      💡 小技巧：也可以直接輸入「班級名稱 座號」例如：「三年一班 5」
    </div>
  </div>
  <div id="scanResultView" class="hidden">
    <div class="retro-card p-3 mb-3 flex justify-between items-center bg-[#e8f5e9]">
      <div>
        <span id="scanStudentName" class="text-xl font-black font-serif"></span>
        <span id="scanStudentInfo" class="text-sm text-retro-ink/60 font-serif ml-2"></span>
      </div>
      <button onclick="clearScanResult()" class="tool-btn px-3 py-1 text-sm rounded font-serif">清除</button>
    </div>
    <div id="scanAssignments" class="space-y-2"></div>
  </div>
  <div id="scanEmpty" class="retro-card p-6 text-center text-retro-ink/50 font-serif">
    <div class="text-4xl mb-2">📷</div>
    <div class="font-bold mb-1">準備掃描</div>
    <div class="text-sm">掃描學生 QR Code 後，這裡會顯示該生的作業繳交狀態</div>
  </div>
</div>

<!-- ===== 學生管理 ===== -->
<div id="tab-students" class="tab-content">
  <div class="retro-card p-3 mb-3">
    <h3 class="font-bold font-serif mb-1 text-sm">📥 匯入學生名單</h3>
    <p class="text-xs text-retro-ink/60 mb-1 font-serif">每行「座號 姓名」，例如：<code class="bg-gray-100 px-1">1 王小明</code></p>
    <textarea id="studentInput" rows="6" class="retro-input w-full p-2 rounded-lg font-mono text-sm mb-2" placeholder="直接輸入，不用空格也可以：&#10;1王小明&#10;2陳小華&#10;3林小美&#10;4李小明&#10;5張小華"></textarea>
    <div class="flex gap-2 flex-wrap items-center">
      <button onclick="importStudents()" class="btn bg-[#2980b9] text-white px-4 py-2 text-sm rounded font-bold font-serif">匯入學生</button>
      <button onclick="document.getElementById('studentInput').value='';document.getElementById('importResult').textContent='';" class="btn bg-retro-paper px-3 py-2 text-sm rounded font-serif">清除</button>
      <button onclick="printQRCodes()" class="btn bg-[#8e44ad] text-white px-3 py-2 text-sm rounded font-bold font-serif">🖨️ 印 QR Code</button>
      <span id="importResult" class="text-sm ml-1 font-serif"></span>
    </div>
  </div>
  <div id="studentList" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-8 gap-2"></div>
  <div id="qrCodePreview" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50" onclick="this.classList.add('hidden')">
    <div class="retro-card p-4 max-w-sm text-center" onclick="event.stopPropagation()">
      <h3 class="font-bold font-serif mb-1" id="qrPreviewName"></h3>
      <div id="qrPreviewImg" class="flex justify-center mb-1"></div>
      <p class="text-xs text-retro-ink/60 font-serif">讓學生掃此 QR Code 繳交作業</p>
      <button class="btn bg-retro-paper px-3 py-1 text-sm rounded font-serif mt-2" onclick="document.getElementById('qrCodePreview').classList.add('hidden'); document.getElementById('qrPreviewImg').innerHTML='';">關閉</button>
    </div>
  </div>
</div>

<!-- ===== 科目管理 ===== -->
<div id="tab-subjects" class="tab-content">
  <div class="retro-card p-3 mb-3">
    <div class="flex gap-2">
      <input id="subjectInput" placeholder="輸入科目名稱（如：國語、數學）" class="retro-input flex-1 p-2 rounded-lg font-serif text-sm">
      <button onclick="createSubject()" class="btn bg-[#27ae60] text-white px-3 py-1 text-sm rounded font-bold font-serif">新增</button>
    </div>
  </div>
  <div id="subjectList" class="flex flex-wrap gap-2"></div>
</div>

<!-- ===== 作業管理 ===== -->
<div id="tab-assignments" class="tab-content">
  <div class="retro-card p-3 mb-3">
    <h3 class="font-bold font-serif mb-1 text-sm">📝 開新作業</h3>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-2">
      <select id="hwSubject" class="retro-input p-2 rounded-lg font-serif text-sm"><option value="">選擇科目</option></select>
      <input id="hwTitle" placeholder="作業名稱" class="retro-input p-2 rounded-lg font-serif text-sm">
      <input id="hwDueDate" type="date" class="retro-input p-2 rounded-lg font-serif text-sm">
      <input id="hwDesc" placeholder="備註（選填）" class="retro-input p-2 rounded-lg font-serif text-sm">
    </div>
    <button onclick="createAssignment()" class="btn bg-[#8e44ad] text-white px-3 py-1 text-sm rounded font-bold font-serif">建立</button>
  </div>
  <div id="assignmentList"></div>
</div>

<!-- ===== 繳交檢查 ===== -->
<div id="tab-check" class="tab-content">
  <div class="mb-2 flex gap-2">
    <select id="checkAssignment" class="retro-input flex-1 p-2 rounded-lg font-serif text-sm"><option value="">選擇作業</option></select>
    <button onclick="loadCheckView()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-bold font-serif">載入</button>
  </div>
  <div id="checkView" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-8 gap-2"></div>
</div>

<!-- ===== 全班一覽 ===== -->
<div id="tab-display" class="tab-content">
  <div class="flex justify-between items-center mb-2">
    <h2 id="displayTitle" class="text-lg font-black font-serif">📺 全班繳交一覽</h2>
    <button onclick="toggleDisplayMode()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-serif" id="displayModeBtn">隱藏已完成的</button>
  </div>
  <div id="displayGrid" class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2"></div>
</div>

<!-- ===== 報表 ===== -->
<div id="tab-export" class="tab-content">
  <div class="retro-card p-3">
    <h3 class="font-bold font-serif mb-2">📊 報表</h3>
    <div class="flex gap-2 flex-wrap">
      <button onclick="exportCSV()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-bold font-serif">📥 下載 CSV</button>
      <button onclick="printClass()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-bold font-serif">🖨️ 列印全班</button>
      <button onclick="printContactBook()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-bold font-serif">📔 聯絡簿</button>
    </div>
  </div>
  <div id="printArea" class="print-section"></div>
</div>

</main>

<!-- ===== 登入 Modal ===== -->
<div id="welcomeModal" class="modal-overlay">
  <div class="retro-card p-6 max-w-sm mx-4 text-center">
    <h2 class="text-2xl font-black font-serif mb-2">📋 作業繳交系統</h2>
    <p class="text-sm text-retro-ink/60 mb-4 font-serif">輸入你的姓名開始使用</p>
    <input id="welcomeName" type="text" placeholder="例如：王老師" class="retro-input w-full p-3 rounded-lg font-serif mb-3">
    <button onclick="welcomeLogin()" class="btn bg-[#c0392b] text-white px-6 py-3 rounded-lg w-full font-bold font-serif">開始使用</button>
  </div>
</div>

<!-- ===== 通用 Modal ===== -->
<div id="modal" class="modal-overlay">
  <div class="retro-card p-4 max-w-md w-full mx-4">
    <h3 id="modalTitle" class="text-lg font-black font-serif mb-2"></h3>
    <div id="modalBody"></div>
    <div class="flex justify-end gap-2 mt-3">
      <button onclick="closeModal()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-serif">關閉</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Supabase 設定
// ============================================================
const SUPABASE_URL = 'https://ngyhbvvjcmuwujufyche.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-kg258b_zjzHRkT96c1PjA_BD8Au2Pb';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  teacherName: localStorage.getItem('teacher_name') || '',
  role: localStorage.getItem('teacher_role') || 'teacher',
  lang: localStorage.getItem('app_lang') || 'zh',
  classes: [],
  currentClassId: null,
  students: [],
  subjects: [],
  assignments: [],
  submissions: [],
  currentToken: null,
  displayMode: 'all',
  qrMode: localStorage.getItem('qr_mode') || 'student',
  voiceSettings: JSON.parse(localStorage.getItem('voice_settings') || '{"enabled":true,"lang":"zh-TW","rate":1.2,"speakName":false}'),
  currentScanStudent: null,
  currentScanClassId: null
};

// ============================================================
// 工具函式
// ============================================================
function generateToken() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let t = '';
  for (let i = 0; i < 16; i++) t += chars.charAt(Math.floor(Math.random() * chars.length));
  return t;
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}
function statusClass(s) { return { submitted:'status-submitted', missing:'status-missing', needs_correction:'status-needs_correction', corrected:'status-corrected', pending:'status-pending', late:'status-late' }[s] || 'status-pending'; }
function statusLabel(s) { return { submitted:'✅已繳', missing:'❌缺交', needs_correction:'📝待訂正', corrected:'✔️已訂正', pending:'⏳未繳', late:'⚠️遲交' }[s] || s; }

// ============================================================
// 登入
// ============================================================
function welcomeLogin() {
  const name = document.getElementById('welcomeName').value.trim();
  if (!name) { alert('請輸入姓名'); return; }
  state.teacherName = name;
  localStorage.setItem('teacher_name', name);
  document.getElementById('welcomeModal').classList.remove('active');
  afterLogin();
}
function teacherLogin() {
  const name = document.getElementById('teacherNameInput').value.trim();
  if (!name) return;
  state.teacherName = name;
  localStorage.setItem('teacher_name', name);
  afterLogin();
}
function showSwitchTeacher() {
  document.getElementById('loginArea').classList.remove('hidden');
  document.getElementById('loginArea').classList.add('flex');
  document.getElementById('teacherArea').classList.add('hidden');
  document.getElementById('teacherArea').classList.remove('flex');
  document.getElementById('classSelector').classList.add('hidden');
  document.getElementById('teacherNameInput').value = '';
  document.getElementById('teacherNameInput').focus();
}
function teacherLogout() {
  state.teacherName = '';
  localStorage.removeItem('teacher_name');
  localStorage.removeItem('last_class_id');
  showSwitchTeacher();
}
async function afterLogin() {
  document.getElementById('loginArea').classList.add('hidden');
  document.getElementById('teacherArea').classList.remove('hidden');
  document.getElementById('teacherArea').classList.add('flex');
  document.getElementById('teacherNameDisplay').textContent = state.teacherName + ' 老師';
  try {
    await loadClasses();
  } catch (e) {
    alert('連線失敗：' + e.message);
  }
}

// ============================================================
// 班級管理
// ============================================================
async function loadClasses() {
  const { data, error } = await sb.from('classes').select('*').eq('teacher_name', state.teacherName).order('id');
  if (error) throw error;
  state.classes = data || [];
  const sel = document.getElementById('classSelectNav');
  sel.innerHTML = state.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('classSelector').classList.remove('hidden');
  if (state.classes.length > 0) {
    const lastId = parseInt(localStorage.getItem('last_class_id') || '0');
    const target = state.classes.find(c => c.id === lastId) ? lastId : state.classes[0].id;
    await switchClass(target);
  } else {
    showCreateClass();
  }
  updateStudentClassSelect();
}
async function switchClass(id) {
  state.currentClassId = id;
  localStorage.setItem('last_class_id', id);
  document.getElementById('classSelectNav').value = id;
  await loadClassData();
  renderAllTabs();
}
async function loadClassData() {
  const cid = state.currentClassId;
  if (!cid) return;
  const [sRes, subRes, aRes] = await Promise.all([
    sb.from('students').select('*').eq('class_id', cid).order('student_number'),
    sb.from('subjects').select('*').eq('class_id', cid).order('id'),
    sb.from('assignments').select('*, subjects(name)').eq('class_id', cid).order('id', { ascending: false })
  ]);
  if (sRes.error) throw sRes.error;
  if (subRes.error) throw subRes.error;
  if (aRes.error) throw aRes.error;
  state.students = sRes.data || [];
  state.subjects = subRes.data || [];
  state.assignments = aRes.data || [];
  state.submissions = [];
}
function renderAllTabs() {
  renderStudents();
  renderSubjects();
  renderAssignments();
  initCheckView();
  renderDisplay();
}
function updateStudentClassSelect() {
  const sel = document.getElementById('studentClassSelect');
  if (!sel) return;
  sel.innerHTML = '<option value="">班級</option>' + state.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

// ============================================================
// Tab 切換
// ============================================================
function switchMainTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'display') renderDisplay();
}

// ============================================================
// 學生管理
// ============================================================
function renderStudents() {
  const el = document.getElementById('studentList');
  if (!state.students.length) {
    el.innerHTML = '<div class="text-retro-ink/50 font-serif text-sm col-span-full">尚未匯入學生</div>';
    return;
  }
  el.innerHTML = state.students.map(s => `
    <div class="retro-card p-1 text-center text-xs font-serif cursor-pointer hover:bg-white" onclick="showQR('${s.name}', ${s.student_number}, '${s.qr_token || ''}')">
      <span class="font-black">${s.student_number}</span>. ${s.name}
      <div class="text-[10px] text-retro-ink/40 mt-0.5">${s.qr_token ? '📱 QR' : '❌'}</div>

// 智能解析每一行學生資料：支持任何分隔或無分隔
function parseStudentLine(rawLine) {
  const line = rawLine.trim().replace(/[\u200B-\u200D\uFEFF]/g, '');
  if (!line) return null;
  const fullToHalf = { '０':'0','１':'1','２':'2','３':'3','４':'4','５':'5','６':'6','７':'7','８':'8','９':'9' };
  let normalized = '';
  for (let c of line) { normalized += fullToHalf[c] || c; }
  let m = normalized.match(/^(\d+)[\s\t,，.、]*(.+)$/);
  if (m) return { student_number: parseInt(m[1]), name: m[2].trim() };
  let numStr = '', nameStr = '';
  for (let i = 0; i < normalized.length; i++) {
    const c = normalized[i];
    if (/\d/.test(c) && nameStr === '') { numStr += c; } else { nameStr += c; }
  }
  if (numStr && nameStr.trim()) return { student_number: parseInt(numStr), name: nameStr.trim() };
  return null;
}

async function importStudents() {
  const input = document.getElementById('studentInput').value;
  const result = document.getElementById('importResult');
  if (!input || !input.trim()) { result.textContent = '❌ 請輸入資料'; return; }
  if (!state.currentClassId) { result.textContent = '❌ 請先建立或選擇班級'; return; }
  const lines = input.replace(/\r\n/g, '\n').split('\n');
  const students = [];
  const errors = [];
  lines.forEach((line, idx) => {
    const parsed = parseStudentLine(line);
    if (parsed) {
      students.push({ class_id: state.currentClassId, student_number: parsed.student_number, name: parsed.name, qr_token: generateToken() });
    } else if (line.trim()) {
      errors.push('第' + (idx+1) + '行「' + line.trim() + '」');
    }
  });
  if (students.length === 0) {
    result.innerHTML = '❌ 格式錯誤<br><span class="text-xs text-retro-ink/60">直接輸入「1王小明」或「1 王小明」都可以</span>';
    return;
  }
  try {
    const { data, error } = await sb.from('students').upsert(students, { onConflict: 'class_id,student_number' }).select();
    if (error) throw error;
    let msg = '✅ 匯入 ' + (data ? data.length : students.length) + ' 人';
    if (errors.length > 0) msg += '<br><span class="text-xs text-orange-600">⚠️ ' + errors.length + ' 行未匯入</span>';
    result.innerHTML = msg;
    document.getElementById('studentInput').value = '';
    await loadClassData();
    renderStudents();
  } catch (e) { result.textContent = '❌ ' + e.message; }
}

function parseScanInput(input) {
  input = input.trim();
  const urlMatch = input.match(/#\/student\/(\w+)/);
  if (urlMatch) return { type: 'token', token: urlMatch[1] };
  if (/^[a-zA-Z0-9_-]+$/.test(input) && input.length >= 4) return { type: 'token', token: input };
  const parts = input.split(/\s+/);
  if (parts.length >= 2) {
    const last = parts[parts.length - 1];
    const num = parseInt(last);
    if (!isNaN(num)) {
      const className = parts.slice(0, -1).join(' ');
      return { type: 'classSeat', className, seatNumber: num };
    }
  }
  return { type: 'unknown' };
}

async function teacherScanStudent() {
  const input = document.getElementById('scanTokenInput').value;
  if (!input) { alert('請輸入或掃描學生 QR Code'); return; }
  const parsed = parseScanInput(input);
  let student = null;
  let classData = null;
  try {
    if (parsed.type === 'token') {
      const { data } = await sb.from('students').select('*, classes(name, teacher_name)').eq('qr_token', parsed.token).single();
      student = data;
      if (student) classData = student.classes;
    } else if (parsed.type === 'classSeat') {
      const { data: cls } = await sb.from('classes').select('*').eq('name', parsed.className).eq('teacher_name', state.teacherName).single();
      if (!cls) throw new Error('找不到班級「' + parsed.className + '」');
      classData = cls;
      const { data: stu } = await sb.from('students').select('*').eq('class_id', cls.id).eq('student_number', parsed.seatNumber).single();
      student = stu;
    } else {
      throw new Error('無法辨識輸入格式');
    }
    if (!student) throw new Error('找不到此學生');
    if (classData && classData.teacher_name !== state.teacherName) throw new Error('此學生不屬於您的班級');
    state.currentScanStudent = student;
    state.currentScanClassId = student.class_id;
    await renderScanResult(student);
    playAudio('success');
  } catch (e) {
    alert('查詢失敗：' + e.message);
    playAudio('error');
  }
}

      csv += s.student_number + ',' + s.name;
      let done = 0;
      (assignments || []).forEach(a => {
        const sub = subs.find(x => x.student_id === s.id && x.assignment_id === a.id);
        const ok = sub && (sub.status === 'submitted' || sub.status === 'late' || sub.status === 'corrected');
        csv += ',' + (ok ? '✓' : '');
        if (ok) done++;
      });
      csv += ',' + Math.round(done / (assignments.length || 1) * 100) + '%\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = (c ? c.name : 'class') + '_' + todayStr() + '.csv';
    link.click();
  } catch (e) { alert(e.message); }
}
function printClass() {
  const c = state.classes.find(x => x.id === state.currentClassId);
  document.getElementById('printArea').innerHTML = `<div style="text-align:center;margin-bottom:15px;"><h1 style="font-size:20px;font-weight:bold;">${c ? c.name : ''} 繳交紀錄</h1><p style="color:#666;font-size:12px;">${todayStr()}</p></div>
  <table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="background:#f0e6d2;"><th style="border:1px solid #2c2c2c;padding:6px;">座號</th><th style="border:1px solid #2c2c2c;padding:6px;">姓名</th>${state.assignments.slice(0,5).map(a => `<th style="border:1px solid #2c2c2c;padding:6px;">${a.title}</th>`).join('')}</tr></thead><tbody>${state.students.sort((a,b)=>a.student_number-b.student_number).map(s => `<tr><td style="border:1px solid #2c2c2c;padding:6px;text-align:center;">${s.student_number}</td><td style="border:1px solid #2c2c2c;padding:6px;">${s.name}</td>${state.assignments.slice(0,5).map(() => '<td style="border:1px solid #2c2c2c;padding:6px;text-align:center;"></td>').join('')}</tr>`).join('')}</tbody></table>`;
  window.print();
}
function printContactBook() {
  const c = state.classes.find(x => x.id === state.currentClassId);
  const today = new Date().toLocaleDateString('zh-TW');
  document.getElementById('printArea').innerHTML = state.students.sort((a,b)=>a.student_number-b.student_number).map(s => {
    const pendingItems = state.assignments.filter(a => {
      const sub = state.submissions.find(x => x.assignment_id === a.id && x.student_id === s.id);
      return !sub || sub.status === 'needs_correction';
    });
    const missingItems = state.assignments.filter(a => a.due_date && a.due_date < todayStr() && !state.submissions.find(x => x.assignment_id === a.id && x.student_id === s.id && (x.status === 'submitted' || x.status === 'late' || x.status === 'corrected')));
    return `<div style="border:1px dashed #2c2c2c;padding:8px;margin-bottom:8px;page-break-inside:avoid;font-size:12px;"><div style="font-weight:bold;">${c ? c.name : ''} — ${s.name}（${s.student_number}）</div><div style="color:#666;font-size:10px;">${today}</div>
    ${pendingItems.length ? '<div style="margin-top:4px;color:#c0392b;">⚠️ ' + pendingItems.map(a => a.title).join('、') + '</div>' : ''}
    ${missingItems.length ? '<div style="margin-top:2px;color:#c0392b;">❌ ' + missingItems.map(a => a.title).join('、') + '</div>' : ''}
    ${!pendingItems.length && !missingItems.length ? '<div style="margin-top:4px;color:#27ae60;">✅ 全部完成</div>' : ''}
    <div style="margin-top:4px;border-top:1px solid #ddd;padding-top:4px;color:#999;font-size:10px;">家長簽名：______________</div></div>`;
  }).join('');
  window.print();
}

// ============================================================
// 語音
// ============================================================
function playAudio(type) {
  if (!window.speechSynthesis) return;
  const msgs = { welcome: '歡迎使用', success: '繳交成功', error: '無法繳交' };
  const msg = new SpeechSynthesisUtterance(msgs[type] || '');
  msg.lang = 'zh-TW'; msg.rate = 1.2;
  speechSynthesis.cancel();
  speechSynthesis.speak(msg);
}

// ============================================================
// Modal + 建立班級
// ============================================================
let modalCallback = null;
function showModal(title, body, callback) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modal').classList.add('active');
  modalCallback = callback || null;
}
function closeModal() { document.getElementById('modal').classList.remove('active'); modalCallback = null; }
function showCreateClass() {
  showModal('建立班級', `<input id="newClassName" placeholder="班級名稱（如：三年一班）" class="retro-input w-full p-2 rounded font-serif text-sm"><button onclick="doCreateClass()" class="btn bg-[#c0392b] text-white px-3 py-1 rounded font-serif text-sm mt-2 w-full">建立</button>`);
}
async function doCreateClass() {
  const name = document.getElementById('newClassName').value.trim();
  if (!name) return;
  const { error } = await sb.from('classes').insert([{ name, teacher_name: state.teacherName }]);
  if (error) { alert(error.message); return; }
  await loadClasses();
  closeModal();
}

// ============================================================
// Hash 路由（學生 QR Code 掃碼）
// ============================================================
function handleHash() {
  const hash = location.hash.slice(1) || '/';
  if (hash.startsWith('/student/')) {
    const token = hash.split('/')[2];
    if (token) studentScanLogin(token);
  }
}
window.addEventListener('hashchange', handleHash);
async function studentScanLogin(token) {
  try {
    const { data: student } = await sb.from('students').select('*, classes(id, name)').eq('qr_token', token).single();
    if (student) {
      state.currentScanStudent = student;
      state.currentScanClassId = student.class_id;
      document.getElementById('scanTokenInput').value = token;
      await renderScanResult(student);
      switchMainTab('submit');
    }
  } catch (e) { alert('掃碼無效：' + e.message); }
}

// ============================================================
// 啟動
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  handleHash();
  if (state.teacherName) {
    document.getElementById('welcomeModal').classList.remove('active');
    afterLogin();
  } else {
    document.getElementById('welcomeModal').classList.add('active');
  }
});
</script>
