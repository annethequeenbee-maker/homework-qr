<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>作業繳交系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        retro: { bg: '#f0e6d2', paper: '#fffbf0', ink: '#2c2c2c', red: '#c0392b', blue: '#2980b9', green: '#27ae60', board: '#2d3436', wood: '#8e44ad', line: '#bdc3c7', woodDark: '#5d4037', woodLight: '#f7f1e3', yellow: '#f1c40f' }
      },
      fontFamily: { serif: ['"Noto Serif TC"', '"Songti TC"', 'serif'], sans: ['"Noto Sans TC"', 'sans-serif'] },
      boxShadow: { hard: '4px 4px 0px 0px rgba(0,0,0,1)', 'hard-sm': '2px 2px 0px 0px rgba(0,0,0,1)' }
    }
  }
}
</script>
<style>
body { background-color: #f0e6d2; background-image: linear-gradient(#e5dcc5 1px, transparent 1px), linear-gradient(90deg, #e5dcc5 1px, transparent 1px); background-size: 20px 20px; color: #2c2c2c; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.btn { cursor: pointer; border: 2px solid #2c2c2c; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); transition: all 0.1s; }
.btn:active { box-shadow: none; transform: translate(2px, 2px); }
.student-card { cursor: pointer; transition: all 0.15s; border: 2px solid #2c2c2c; }
.student-card:active { transform: scale(0.95); }
.status-submitted { background: #d4edda; border-color: #27ae60; }
.status-missing { background: #f8d7da; border-color: #c0392b; }
.status-needs_correction { background: #fff3cd; border-color: #e67e22; }
.status-corrected { background: #cce5ff; border-color: #2980b9; }
.status-pending { background: #f8f9fa; border-color: #bdc3c7; }
.status-late { background: #fce4ec; border-color: #e74c3c; }
.retro-card { background: #fffbf0; border: 2px solid #2c2c2c; box-shadow: 3px 3px 0 0 rgba(0,0,0,1); }
.retro-input { border: 2px solid #2c2c2c; background: #fffbf0; }
.retro-input:focus { outline: none; box-shadow: 0 0 0 3px rgba(192,57,43,0.3); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.active { display: flex; }
.print-section { display: none; }
@media print { body { background: white; } .no-print { display: none !important; } .print-section { display: block !important; } }
.nav-tab { cursor: pointer; padding: 8px 16px; font-size: 14px; font-weight: bold; border: 2px solid #2c2c2c; background: #fffbf0; transition: all 0.1s; font-family: "Noto Serif TC", serif; white-space: nowrap; }
.nav-tab:hover { background: white; }
.nav-tab.active { background: #f1c40f; box-shadow: 2px 2px 0 0 rgba(0,0,0,1); }
.nav-tab:active { box-shadow: none; transform: translate(2px, 2px); }
.wood-bar { background: #f7f1e3; border: 2px solid #5d4037; box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
.tool-btn { background: #fffbf0; border: 2px solid #5d4037; box-shadow: 2px 2px 0px 0px rgba(0,0,0,1); }
.tool-btn:active { box-shadow: none; transform: translate(2px, 2px); }
/* 復古捲軸 */
.retro-scrollbar::-webkit-scrollbar { width: 12px; height: 12px; }
.retro-scrollbar::-webkit-scrollbar-track { background: #e0d0b0; border-left: 2px solid #2c2c2c; }
.retro-scrollbar::-webkit-scrollbar-thumb { background: #2c2c2c; border: 2px solid #e0d0b0; }
</style>
</head>
<body>

<!-- 裝飾暗角 -->
<div class="fixed inset-0 pointer-events-none shadow-[inset_0_0_100px_rgba(44,44,44,0.15)] z-10"></div>

<!-- ===== 頂部導航列（參考 routines.html 風格） ===== -->
<div class="no-print wood-bar rounded-[1.5rem] px-4 py-3 mx-4 mt-4 mb-2 flex justify-between items-center z-20 sticky top-0">
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="p-1 border-2 border-[#5d4037] bg-[#fcfbf9] flex items-center justify-center rounded-lg">
        <span class="text-xl">📋</span>
      </div>
      <span class="text-2xl font-black font-serif text-retro-ink tracking-widest hidden md:inline">作業繳交系統</span>
    </div>
    <div class="flex gap-1 overflow-x-auto retro-scrollbar" id="mainTabs">
      <div class="nav-tab active" data-tab="submit" onclick="switchMainTab('submit')">🎒 繳交</div>
      <div class="nav-tab" data-tab="students" onclick="switchMainTab('students')">👥 學生</div>
      <div class="nav-tab" data-tab="subjects" onclick="switchMainTab('subjects')">📚 科目</div>
      <div class="nav-tab" data-tab="assignments" onclick="switchMainTab('assignments')">📝 作業</div>
      <div class="nav-tab" data-tab="check" onclick="switchMainTab('check')">✅ 檢查</div>
      <div class="nav-tab" data-tab="display" onclick="switchMainTab('display')">📺 一覽</div>
      <div class="nav-tab" data-tab="export" onclick="switchMainTab('export')">📊 報表</div>
    </div>
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <div id="loginArea" class="flex gap-1">
      <input id="teacherNameInput" type="text" placeholder="老師姓名" class="retro-input text-sm p-1 rounded w-24 font-serif" onkeydown="if(event.key==='Enter')teacherLogin()">
      <button onclick="teacherLogin()" class="btn bg-[#c0392b] text-white px-3 py-1 text-sm rounded font-bold font-serif">登入</button>
    </div>
    <div id="teacherArea" class="hidden items-center gap-1">
      <span id="teacherNameDisplay" class="text-sm font-bold font-serif px-2"></span>
      <div id="classSelector" class="hidden">
        <select id="classSelectNav" onchange="switchClass(parseInt(this.value))" class="retro-input text-sm p-1 rounded font-serif"></select>
      </div>
      <button onclick="teacherLogout()" class="tool-btn px-2 py-1 text-xs rounded font-serif">登出</button>
    </div>
  </div>
</div>

<main class="max-w-6xl mx-auto p-3">

<!-- ===== 繳交模式 ===== -->
<div id="tab-submit" class="tab-content active">
  <div class="retro-card p-3 mb-3">
    <div class="flex items-center gap-2 flex-wrap">
      <input id="studentTokenInput" placeholder="掃 QR Code 自動帶入，或手動輸入座號" class="retro-input flex-1 p-2 rounded-lg font-serif text-sm min-w-[200px]">
      <select id="studentClassSelect" class="retro-input p-2 rounded-lg font-serif text-sm"><option value="">班級</option></select>
      <input id="studentIdInput" type="number" placeholder="座號" class="retro-input w-16 p-2 rounded-lg font-serif text-sm">
      <button onclick="studentManualLogin()" class="btn bg-[#2980b9] text-white px-3 py-2 text-sm rounded font-bold font-serif">進入</button>
    </div>
  </div>
  <div id="studentView" class="hidden">
    <div class="retro-card p-3 mb-3 flex justify-between items-center">
      <div><span id="studentName" class="text-xl font-black font-serif"></span> <span id="studentClass" class="text-sm text-retro-ink/60 font-serif"></span></div>
      <button onclick="showStudentScan()" class="tool-btn px-3 py-1 text-sm rounded font-serif">換學生</button>
    </div>
    <div id="studentAssignments" class="space-y-2"></div>
  </div>
  <div id="studentEmpty" class="retro-card p-6 text-center text-retro-ink/50 font-serif">👆 輸入座號或掃 QR Code 開始繳交</div>
</div>

<!-- ===== 學生管理 ===== -->
<div id="tab-students" class="tab-content">
  <div class="retro-card p-3 mb-3">
    <h3 class="font-bold font-serif mb-1 text-sm">📥 匯入學生名單</h3>
    <p class="text-xs text-retro-ink/60 mb-1 font-serif">每行「座號 姓名」，例如：<code class="bg-gray-100 px-1">1 王小明</code></p>
    <textarea id="studentInput" rows="6" class="retro-input w-full p-2 rounded-lg font-mono text-sm mb-2" placeholder="1 王小明&#10;2 陳小華&#10;3 林小美&#10;4 李小明&#10;5 張小華"></textarea>
    <div class="flex gap-2">
      <button onclick="importStudents()" class="btn bg-[#2980b9] text-white px-3 py-1 text-sm rounded font-bold font-serif">匯入</button>
      <button onclick="printQRCodes()" class="btn bg-[#8e44ad] text-white px-3 py-1 text-sm rounded font-bold font-serif">🖨️ QR Code</button>
      <span id="importResult" class="text-sm ml-1 font-serif self-center"></span>
    </div>
  </div>
  <div id="studentList" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-8 gap-2"></div>
  <div id="qrCodePreview" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50" onclick="this.classList.add('hidden')">
    <div class="retro-card p-4 max-w-sm text-center" onclick="event.stopPropagation()">
      <h3 class="font-bold font-serif mb-1" id="qrPreviewName"></h3>
      <div id="qrPreviewImg" class="flex justify-center mb-1"></div>
      <p class="text-xs text-retro-ink/60 font-serif">讓學生掃此 QR Code 繳交作業</p>
      <button class="btn bg-retro-paper px-3 py-1 text-sm rounded font-serif mt-2" onclick="document.getElementById('qrCodePreview').classList.add('hidden')">關閉</button>
    </div>
  </div>
</div>

<!-- ===== 科目管理 ===== -->
<div id="tab-subjects" class="tab-content">
  <div class="retro-card p-3 mb-3">
    <div class="flex gap-2">
      <input id="subjectInput" placeholder="輸入科目名稱（如：國語、數學）" class="retro-input flex-1 p-2 rounded-lg font-serif text-sm">
      <button onclick="createSubject()" class="btn bg-[#27ae60] text-white px-3 py-1 text-sm rounded font-bold font-serif">新增</button>
    </div>
  </div>
  <div id="subjectList" class="flex flex-wrap gap-2"></div>
</div>

<!-- ===== 作業管理 ===== -->
<div id="tab-assignments" class="tab-content">
  <div class="retro-card p-3 mb-3">
    <h3 class="font-bold font-serif mb-1 text-sm">📝 開新作業</h3>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-2">
      <select id="hwSubject" class="retro-input p-2 rounded-lg font-serif text-sm"><option value="">選擇科目</option></select>
      <input id="hwTitle" placeholder="作業名稱" class="retro-input p-2 rounded-lg font-serif text-sm">
      <input id="hwDueDate" type="date" class="retro-input p-2 rounded-lg font-serif text-sm">
      <input id="hwDesc" placeholder="備註（選填）" class="retro-input p-2 rounded-lg font-serif text-sm">
    </div>
    <button onclick="createAssignment()" class="btn bg-[#8e44ad] text-white px-3 py-1 text-sm rounded font-bold font-serif">建立</button>
  </div>
  <div id="assignmentList"></div>
</div>

<!-- ===== 繳交檢查 ===== -->
<div id="tab-check" class="tab-content">
  <div class="mb-2 flex gap-2">
    <select id="checkAssignment" class="retro-input flex-1 p-2 rounded-lg font-serif text-sm"><option value="">選擇作業</option></select>
    <button onclick="loadCheckView()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-bold font-serif">載入</button>
  </div>
  <div id="checkView" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-8 gap-2"></div>
</div>

<!-- ===== 全班一覽 ===== -->
<div id="tab-display" class="tab-content">
  <div class="flex justify-between items-center mb-2">
    <h2 id="displayTitle" class="text-lg font-black font-serif">📺 全班繳交一覽</h2>
    <button onclick="toggleDisplayMode()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-serif" id="displayModeBtn">隱藏已完成的</button>
  </div>
  <div id="displayGrid" class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2"></div>
</div>

<!-- ===== 報表 ===== -->
<div id="tab-export" class="tab-content">
  <div class="retro-card p-3">
    <h3 class="font-bold font-serif mb-2">📊 報表</h3>
    <div class="flex gap-2 flex-wrap">
      <button onclick="exportCSV()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-bold font-serif">📥 下載 CSV</button>
      <button onclick="printClass()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-bold font-serif">🖨️ 列印全班</button>
      <button onclick="printContactBook()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-bold font-serif">📔 聯絡簿</button>
    </div>
  </div>
  <div id="printArea" class="print-section"></div>
</div>

</main>

<!-- ===== 登入 Modal ===== -->
<div id="welcomeModal" class="modal-overlay">
  <div class="retro-card p-6 max-w-sm mx-4 text-center">
    <h2 class="text-2xl font-black font-serif mb-2">📋 作業繳交系統</h2>
    <p class="text-sm text-retro-ink/60 mb-4 font-serif">輸入你的姓名開始使用</p>
    <input id="welcomeName" type="text" placeholder="例如：王老師" class="retro-input w-full p-3 rounded-lg font-serif mb-3">
    <button onclick="welcomeLogin()" class="btn bg-[#c0392b] text-white px-6 py-3 rounded-lg w-full font-bold font-serif">開始使用</button>
  </div>
</div>

<!-- ===== 通用 Modal ===== -->
<div id="modal" class="modal-overlay">
  <div class="retro-card p-4 max-w-md w-full mx-4">
    <h3 id="modalTitle" class="text-lg font-black font-serif mb-2"></h3>
    <div id="modalBody"></div>
    <div class="flex justify-end gap-2 mt-3">
      <button onclick="closeModal()" class="btn bg-retro-paper px-3 py-1 text-sm rounded font-serif">關閉</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Supabase 設定
// ============================================================
const SUPABASE_URL = 'https://ngyhbvvjcmuwujufyche.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-kg258b_zjzHRkT96c1PjA_BD8Au2Pb';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  teacherName: localStorage.getItem('teacher_name') || '',
  classes: [],
  currentClassId: null,
  students: [],
  subjects: [],
  assignments: [],
  submissions: [],
  currentToken: null,
  displayMode: 'all'
};

// ============================================================
// 工具函式
// ============================================================
function generateToken() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let t = '';
  for (let i = 0; i < 16; i++) t += chars.charAt(Math.floor(Math.random() * chars.length));
  return t;
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}
function statusClass(s) { return { submitted:'status-submitted', missing:'status-missing', needs_correction:'status-needs_correction', corrected:'status-corrected', pending:'status-pending', late:'status-late' }[s] || 'status-pending'; }
function statusLabel(s) { return { submitted:'✅已繳', missing:'❌缺交', needs_correction:'📝待訂正', corrected:'✔️已訂正', pending:'⏳未繳', late:'⚠️遲交' }[s] || s; }

// ============================================================
// 登入
// ============================================================
function welcomeLogin() {
  const name = document.getElementById('welcomeName').value.trim();
  if (!name) { alert('請輸入姓名'); return; }
  state.teacherName = name;
  localStorage.setItem('teacher_name', name);
  document.getElementById('welcomeModal').classList.remove('active');
  afterLogin();
}
function teacherLogin() {
  const name = document.getElementById('teacherNameInput').value.trim();
  if (!name) return;
  state.teacherName = name;
  localStorage.setItem('teacher_name', name);
  afterLogin();
}
function teacherLogout() {
  state.teacherName = '';
  localStorage.removeItem('teacher_name');
  location.reload();
}
async function afterLogin() {
  document.getElementById('loginArea').classList.add('hidden');
  document.getElementById('teacherArea').classList.remove('hidden');
  document.getElementById('teacherArea').classList.add('flex');
  document.getElementById('teacherNameDisplay').textContent = state.teacherName + ' 老師';
  try {
    await loadClasses();
  } catch (e) {
    alert('連線失敗：' + e.message);
  }
}

// ============================================================
// 班級管理
// ============================================================
async function loadClasses() {
  const { data, error } = await sb.from('classes').select('*').eq('teacher_name', state.teacherName).order('id');
  if (error) throw error;
  state.classes = data || [];
  const sel = document.getElementById('classSelectNav');
  sel.innerHTML = state.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('classSelector').classList.remove('hidden');
  if (state.classes.length > 0) {
    await switchClass(state.classes[0].id);
  } else {
    showCreateClass();
  }
  updateStudentClassSelect();
}
async function switchClass(id) {
  state.currentClassId = id;
  document.getElementById('classSelectNav').value = id;
  await loadClassData();
  renderAllTabs();
}
async function loadClassData() {
  const cid = state.currentClassId;
  if (!cid) return;
  const [sRes, subRes, aRes] = await Promise.all([
    sb.from('students').select('*').eq('class_id', cid).order('student_number'),
    sb.from('subjects').select('*').eq('class_id', cid).order('id'),
    sb.from('assignments').select('*, subjects(name)').eq('class_id', cid).order('id', { ascending: false })
  ]);
  if (sRes.error) throw sRes.error;
  if (subRes.error) throw subRes.error;
  if (aRes.error) throw aRes.error;
  state.students = sRes.data || [];
  state.subjects = subRes.data || [];
  state.assignments = aRes.data || [];
  state.submissions = [];
}
function renderAllTabs() {
  renderStudents();
  renderSubjects();
  renderAssignments();
  initCheckView();
  renderDisplay();
}
function updateStudentClassSelect() {
  const sel = document.getElementById('studentClassSelect');
  sel.innerHTML = '<option value="">班級</option>' + state.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

// ============================================================
// Tab 切換
// ============================================================
function switchMainTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'display') renderDisplay();
}

// ============================================================
// 學生管理
// ============================================================
function renderStudents() {
  const el = document.getElementById('studentList');
  if (!state.students.length) {
    el.innerHTML = '<div class="text-retro-ink/50 font-serif text-sm col-span-full">尚未匯入學生</div>';
    return;
  }
  el.innerHTML = state.students.map(s => `
    <div class="retro-card p-1 text-center text-xs font-serif cursor-pointer hover:bg-white" onclick="showQR('${s.name}', ${s.student_number}, '${s.qr_token || ''}')">
      <span class="font-black">${s.student_number}</span>. ${s.name}
      <div class="text-[10px] text-retro-ink/40 mt-0.5">${s.qr_token ? '📱 QR' : '❌'}</div>
    </div>
  `).join('');
}
async function importStudents() {
  const input = document.getElementById('studentInput').value.trim();
  const result = document.getElementById('importResult');
  if (!input) { result.textContent = '請輸入資料'; return; }
  if (!state.currentClassId) { result.textContent = '請先建立班級'; return; }
  const lines = input.split('\n').filter(l => l.trim());
  const students = [];
  lines.forEach(line => {
    const m = line.trim().match(/^(\d+)[\s,，.]+(.+)$/);
    if (m) students.push({ class_id: state.currentClassId, student_number: parseInt(m[1]), name: m[2].trim(), qr_token: generateToken() });
  });
  if (students.length === 0) { result.textContent = '格式錯誤'; return; }
  try {
    const { data, error } = await sb.from('students').upsert(students, { onConflict: 'class_id,student_number' }).select();
    if (error) throw error;
    result.textContent = '✅ ' + (data ? data.length : students.length) + ' 人';
    await loadClassData();
    renderStudents();
  } catch (e) { result.textContent = '❌ ' + e.message; }
}

// ============================================================
// QR Code
// ============================================================
function getQRUrl(token) {
  const base = window.location.href.split('#')[0];
  return token ? base + '#/student/' + token : base + '#/student';
}
function showQR(name, sid, token) {
  document.getElementById('qrCodePreview').classList.remove('hidden');
  document.getElementById('qrPreviewName').textContent = name + ' (' + sid + ')';
  const preview = document.getElementById('qrPreviewImg');
  preview.innerHTML = '';
  const url = getQRUrl(token);
  if (typeof QRCode !== 'undefined') {
    new QRCode(preview, { text: url, width: 150, height: 150 });
  } else {
    preview.innerHTML = '<div class="text-center text-retro-ink/50 font-serif text-xs">載入中...<br><span class="text-[10px]">' + url + '</span></div>';
  }
}
function printQRCodes() {
  const el = document.getElementById('printArea');
  const c = state.classes.find(x => x.id === state.currentClassId);
  el.innerHTML = `<style>.qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:15px}.qr-item{text-align:center;border:1px dashed #ccc;padding:10px;page-break-inside:avoid}@media print{body{background:white}}</style>
  <h2 style="text-align:center;font-size:18px;font-weight:bold;margin-bottom:15px;">${c ? c.name : ''} QR Code</h2><div class="qr-grid" id="qrGrid"></div>`;
  document.getElementById('printArea').classList.remove('print-section');
  document.getElementById('printArea').style.display = 'block';
  const grid = document.getElementById('qrGrid');
  state.students.sort((a, b) => a.student_number - b.student_number).forEach(s => {
    const item = document.createElement('div');
    item.className = 'qr-item';
    const url = getQRUrl(s.qr_token);
    item.innerHTML = `<div style="font-size:13px;font-weight:bold;margin-bottom:5px;">${s.student_number}. ${s.name}</div><div id="qr_${s.student_number}"></div><div style="font-size:9px;color:#999;margin-top:5px;">${url}</div>`;
    grid.appendChild(item);
    setTimeout(() => {
      const qrEl = document.getElementById('qr_' + s.student_number);
      if (qrEl && typeof QRCode !== 'undefined') new QRCode(qrEl, { text: url, width: 100, height: 100 });
    }, 100);
  });
  setTimeout(() => window.print(), 1000);
}

async function loadCheckView() {
  const aid = parseInt(document.getElementById('checkAssignment').value);
  if (!aid) return;
  try {
    const { data: assignment } = await sb.from('assignments').select('*').eq('id', aid).single();
    const { data: submissions } = await sb.from('submissions').select('*').eq('assignment_id', aid);
    const subs = submissions || [];
    const el = document.getElementById('checkView');
    el.innerHTML = state.students.map(s => {
      const sub = subs.find(x => x.student_id === s.id);
      const status = sub ? sub.status : (assignment && assignment.due_date && assignment.due_date < todayStr() ? 'missing' : 'pending');
      const locked = sub ? sub.locked : false;
      return `<div class="student-card retro-card p-1 text-center text-xs relative ${statusClass(status)}" onclick="handleCheckClick(${aid}, ${s.id}, '${sub ? sub.status : ''}', ${locked}, ${s.student_number}, '${s.name}')">
        <div class="font-black text-sm">${s.student_number}</div>
        <div class="text-[10px]">${s.name}</div>
        <div class="font-bold text-[10px]">${statusLabel(status)}</div>
        ${locked ? '<div class="text-[10px] text-red-600">🔒</div>' : ''}
        ${sub && sub.note ? '<div class="text-[10px] text-orange-600">📝' + sub.note + '</div>' : ''}
      </div>`;
    }).join('');
  } catch (e) { alert(e.message); }
}
async function handleCheckClick(aid, sid, currentStatus, locked, studentNum, studentName) {
  const actions = [];
  if (currentStatus === 'submitted' || currentStatus === 'late' || currentStatus === '') actions.push({ label: '❌ 缺交', action: 'toggle' }, { label: '📝 標記訂正', action: 'correct' });
  if (currentStatus === 'needs_correction') actions.push({ label: '✔️ 已訂正', action: 'corrected' }, { label: '✅ 已繳', action: 'toggle' });
  if (locked) actions.push({ label: '🔓 解鎖', action: 'unlock' });
  if (currentStatus === '') actions.push({ label: '✅ 已繳', action: 'toggle' });
  showModal(studentNum + '. ' + studentName, actions.map(a => `<button onclick="doCheckAction(${aid}, ${sid}, '${a.action}')" class="btn bg-retro-paper px-3 py-1 rounded font-serif text-sm w-full mb-1 text-left">${a.label}</button>`).join('') || '<p class="font-serif text-sm">無操作</p>');
}
async function doCheckAction(aid, sid, action) {
  closeModal();
  try {
    if (action === 'toggle') {
      const { data: existing } = await sb.from('submissions').select('*').eq('assignment_id', aid).eq('student_id', sid).single();
      const isLate = state.assignments.find(a => a.id === aid)?.due_date < todayStr();
      if (existing) {
        await sb.from('submissions').update({ status: isLate ? 'late' : 'submitted', submitted_at: nowStr(), locked: true }).eq('id', existing.id);
      } else {
        await sb.from('submissions').insert({ assignment_id: aid, student_id: sid, status: isLate ? 'late' : 'submitted', submitted_at: nowStr(), locked: true });
      }
    }
    else if (action === 'correct') {
      showModal('標記訂正', `<input id="correctionNote" placeholder="備註" class="retro-input w-full p-2 rounded font-serif text-sm mb-2"><button onclick="doCorrectionNote(${aid}, ${sid})" class="btn bg-[#e67e22] text-white px-3 py-1 rounded font-serif w-full text-sm">確認</button>`);
      return;
    }
    else if (action === 'corrected') {
      const { data: existing } = await sb.from('submissions').select('*').eq('assignment_id', aid).eq('student_id', sid).single();
      if (existing) await sb.from('submissions').update({ status: 'corrected' }).eq('id', existing.id);
    }
    else if (action === 'unlock') {
      const { data: existing } = await sb.from('submissions').select('*').eq('assignment_id', aid).eq('student_id', sid).single();
      if (existing) await sb.from('submissions').update({ locked: false }).eq('id', existing.id);
    }
    await loadCheckView();
  } catch (e) { alert(e.message); }
}
async function doCorrectionNote(aid, sid) {
  const note = document.getElementById('correctionNote').value.trim();
  closeModal();
  const { data: existing } = await sb.from('submissions').select('*').eq('assignment_id', aid).eq('student_id', sid).single();
  if (existing) {
    await sb.from('submissions').update({ status: 'needs_correction', note }).eq('id', existing.id);
  } else {
    await sb.from('submissions').insert({ assignment_id: aid, student_id: sid, status: 'needs_correction', note });
  }
  await loadCheckView();
}

async function loadStudentView(token, classId, studentId) {
  state.currentToken = token;
  state.currentClassId = classId;
  try {
    // Find student by seat number
    const { data: student } = await sb.from('students').select('*').eq('class_id', classId).eq('student_number', studentId).single();
    if (!student) throw new Error('查無此學生');
    // Get assignments with subject names
    const { data: assignments } = await sb.from('assignments').select('*, subjects(name)').eq('class_id', classId);
    // Get submissions for this student
    const { data: submissions } = await sb.from('submissions').select('*').eq('student_id', student.id);
    const subs = submissions || [];
    const today = todayStr();
    const list = (assignments || []).map(a => {
      const sub = subs.find(x => x.assignment_id === a.id);
      const isPastDue = a.due_date && a.due_date < today;
      let status = 'pending';
      let submittedAt = null;
      let locked = false;
      let note = '';
      if (sub) {
        submittedAt = sub.submitted_at;
        locked = sub.locked;
        note = sub.note || '';
        status = sub.status;
      } else if (isPastDue) {
        status = 'missing';
      }
      return {
        assignmentId: a.id,
        subjectName: a.subjects ? a.subjects.name : '',
        title: a.title,
        dueDate: a.due_date,
        description: a.description,
        status,
        submittedAt,
        locked,
        note
      };
    });
    document.getElementById('studentName').textContent = student.name || ('座號 ' + studentId);
    const total = list.length;
    const submitted = list.filter(a => a.status === 'submitted' || a.status === 'corrected' || a.status === 'late').length;
    document.getElementById('studentClass').textContent = total + ' 份作業（已完成 ' + submitted + ' 份）';
    document.getElementById('studentView').classList.remove('hidden');
    document.getElementById('studentEmpty').classList.add('hidden');
    const el = document.getElementById('studentAssignments');
    if (!list.length) {
      el.innerHTML = '<div class="retro-card p-4 text-center text-retro-ink/50 font-serif text-sm">目前沒有作業</div>';
    } else {
      el.innerHTML = list.map(a => `
        <div class="student-card retro-card p-3 ${statusClass(a.status)}" onclick="handleStudentSubmit(${a.assignmentId}, ${student.id}, '${a.status}', ${a.locked})">
          <div class="flex justify-between items-start">
            <div>
              <div class="font-bold font-serif text-sm">${a.subjectName ? '[' + a.subjectName + '] ' : ''}${a.title}</div>
              ${a.description ? '<div class="text-xs text-retro-ink/50 font-serif">' + a.description + '</div>' : ''}
              <div class="text-xs text-retro-ink/40 font-serif">截止: ${a.dueDate || '無'}</div>
            </div>
            <div class="text-right">
              <div class="font-bold text-sm">${statusLabel(a.status)}</div>
              ${a.submittedAt ? '<div class="text-xs text-retro-ink/40 font-serif">' + a.submittedAt + '</div>' : ''}
              ${a.locked ? '<div class="text-xs text-red-600">🔒</div>' : ''}
              ${a.note ? '<div class="text-xs text-orange-600 font-serif">📝 ' + a.note + '</div>' : ''}
            </div>
          </div>
        </div>
      `).join('');
    }
    switchMainTab('submit');
    playAudio('welcome');
  } catch (e) { alert('載入失敗：' + e.message); }
}
async function handleStudentSubmit(aid, sid, status, locked) {
  if ((status === 'submitted' || status === 'late' || status === 'corrected') && locked) {
    showModal('🔒 已鎖定', '<p class="font-serif text-sm">已繳且鎖定，請找老師解鎖</p>'); return;
  }
  if (status === 'needs_correction') {
    showModal('📝 訂正完成？', '<p class="font-serif text-sm mb-2">你已完成訂正了嗎？</p><button onclick="doStudentCorrected(' + aid + ',' + sid + ')" class="btn bg-[#27ae60] text-white px-4 py-2 rounded font-serif w-full mb-1 text-sm">✅ 已完成訂正</button><button onclick="closeModal()" class="btn bg-retro-paper px-4 py-2 rounded font-serif w-full text-sm">還未完成</button>');
    return;
  }
  showModal('📝 確認繳交', '<p class="font-serif text-sm mb-2">確認繳交此作業？</p><button onclick="doStudentSubmit(' + aid + ',' + sid + ')" class="btn bg-[#27ae60] text-white px-4 py-2 rounded font-serif w-full mb-1 text-sm">✅ 確認繳交</button><button onclick="closeModal()" class="btn bg-retro-paper px-4 py-2 rounded font-serif w-full text-sm">取消</button>');
}
async function doStudentSubmit(aid, sid) {
  closeModal();
  try {
    const { data: assignment } = await sb.from('assignments').select('*').eq('id', aid).single();
    const isLate = assignment && assignment.due_date && assignment.due_date < todayStr();
    const { data: existing } = await sb.from('submissions').select('*').eq('assignment_id', aid).eq('student_id', sid).single();
    if (existing) {
      if (existing.locked) throw new Error('此作業已繳交且被鎖定，如需重繳請找老師解鎖');
      await sb.from('submissions').update({ status: isLate ? 'late' : 'submitted', submitted_at: nowStr(), locked: true }).eq('id', existing.id);
    } else {
      await sb.from('submissions').insert({ assignment_id: aid, student_id: sid, status: isLate ? 'late' : 'submitted', submitted_at: nowStr(), locked: true });
    }
    playAudio('success');
    const classId = state.currentClassId;
    const { data: student } = await sb.from('students').select('*').eq('id', sid).single();
    if (classId && student) await loadStudentView(state.currentToken, classId, student.student_number);
    showModal('✅ 繳交成功！', `<p class="font-serif text-center">${isLate ? '⚠️ 已標記為遲交' : '✅ 繳交成功！'}</p>`);
  } catch (e) {
    playAudio('error');
    showModal('⚠️ 失敗', `<p class="font-serif text-sm">${e.message}</p>`);
  }
}
async function doStudentCorrected(aid, sid) {
  closeModal();
  try {
    const { data: existing } = await sb.from('submissions').select('*').eq('assignment_id', aid).eq('student_id', sid).single();
    if (existing) await sb.from('submissions').update({ status: 'corrected' }).eq('id', existing.id);
    playAudio('success');
    const classId = state.currentClassId;
    const { data: student } = await sb.from('students').select('*').eq('id', sid).single();
    if (classId && student) await loadStudentView(state.currentToken, classId, student.student_number);
    showModal('✔️ 訂正完成！', '<p class="font-serif text-center text-sm">訂正已記錄。</p>');
  } catch (e) { alert('操作失敗：' + e.message); }
}

async function exportCSV() {
  try {
    const cid = state.currentClassId;
    if (!cid) return;
    const { data: students } = await sb.from('students').select('*').eq('class_id', cid).order('student_number');
    const { data: assignments } = await sb.from('assignments').select('*').eq('class_id', cid).order('id');
    const assignmentIds = (assignments || []).map(a => a.id);
    let subs = [];
    if (assignmentIds.length) {
      const { data } = await sb.from('submissions').select('*').in('assignment_id', assignmentIds);
      subs = data || [];
    }
    const c = state.classes.find(x => x.id === cid);
    let csv = '\ufeff座號,姓名';
    (assignments || []).forEach(a => { csv += ',' + a.title; });
    csv += ',完成率\n';
    (students || []).forEach(s => {
      csv += s.student_number + ',' + s.name;
      let done = 0;
      (assignments || []).forEach(a => {
        const sub = subs.find(x => x.student_id === s.id && x.assignment_id === a.id);
        const ok = sub && (sub.status === 'submitted' || sub.status === 'late' || sub.status === 'corrected');
        csv += ',' + (ok ? '✓' : '');
        if (ok) done++;
      });
      csv += ',' + Math.round(done / (assignments.length || 1) * 100) + '%\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = (c ? c.name : 'class') + '_' + todayStr() + '.csv';
    link.click();
  } catch (e) { alert(e.message); }
}

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modal').classList.add('active');
  modalCallback = callback || null;
}
function closeModal() { document.getElementById('modal').classList.remove('active'); modalCallback = null; }
function showCreateClass() {
  showModal('建立班級', `<input id="newClassName" placeholder="班級名稱（如：三年一班）" class="retro-input w-full p-2 rounded font-serif text-sm"><button onclick="doCreateClass()" class="btn bg-[#c0392b] text-white px-3 py-1 rounded font-serif text-sm mt-2 w-full">建立</button>`);
}
async function doCreateClass() {
  const name = document.getElementById('newClassName').value.trim();
  if (!name) return;
  const { error } = await sb.from('classes').insert([{ name, teacher_name: state.teacherName }]);
  if (error) { alert(error.message); return; }
  await loadClasses();
  closeModal();
}

// ============================================================
// Hash 路由（學生 QR Code 掃碼）
// ============================================================
function handleHash() {
  const hash = location.hash.slice(1) || '/';
  if (hash.startsWith('/student/')) {
    const token = hash.split('/')[2];
    if (token) studentScanLogin(token);
  }
}
window.addEventListener('hashchange', handleHash);
async function studentScanLogin(token) {
  try {
    const { data: student } = await sb.from('students').select('*, classes(id, name)').eq('qr_token', token).single();
    if (student) await loadStudentView(token, student.class_id, student.student_number);
  } catch (e) { alert('掃碼無效：' + e.message); }
}

// ============================================================
// 啟動
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  handleHash();
  if (state.teacherName) {
    document.getElementById('welcomeName').value = state.teacherName;
    welcomeLogin();
  } else {
    document.getElementById('welcomeModal').classList.add('active');
  }
});
</script>
</body>
</html>
